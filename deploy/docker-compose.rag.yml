# RAG 中间件本地栈：Milvus standalone（etcd + 内部 MinIO）+ 平台对象存储 MinIO。
#
# 用法（在项目根执行）：
#   docker compose -f deploy/docker-compose.rag.yml up -d      # 起栈
#   docker compose -f deploy/docker-compose.rag.yml ps         # 看状态
#   docker compose -f deploy/docker-compose.rag.yml logs -f milvus-standalone
#   docker compose -f deploy/docker-compose.rag.yml down       # 停栈，保留数据
#
# 端口：9000/9001 平台对象存储（S3 API / 控制台），19530 Milvus gRPC，9091 Milvus 健康检查。
# 数据落在 deploy/data/（已 gitignore）。Milvus 的内部 MinIO 不发布端口，只在 compose 网络内可见。
# 版本对应：服务端 milvusdb/milvus:v3.0.1 ↔ 客户端 pymilvus 3.0.1。

name: training-rag

services:
  # 平台文件存储：app/services/storage.py 连它（.env 的 S3_* 指向 127.0.0.1:9000）
  training-minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: training-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data/training-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Milvus 的元数据存储
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Milvus 的内部对象存储（与平台对象存储隔离，避免误删互相影响）
  milvus-minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./data/milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v3.0.1
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - ./data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: training-rag
