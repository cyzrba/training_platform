[project]
name = "traning-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.2",
    "boto3>=1.43.93",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pypdf>=5.1",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

# RAG 二期依赖单独成组，不装入基础环境：
# FlagEmbedding 会连带拉 torch + transformers，镜像体积从 ~200MB 涨到 2GB+；
# pymilvus 需要能连上 Milvus 才有意义。装法：
#   uv sync --extra rag
[project.optional-dependencies]
# AI 问答只需要大模型调用，不背 torch / Milvus：
#   uv sync --extra llm
llm = [
    "langchain-openai",
]
rag = [
    "FlagEmbedding>=1.3",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "pymilvus>=2.5",
    "torch>=2.14",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
# tools/ 是既有的文档生成脚本，不纳入本次后端代码的 lint 范围
exclude = [".venv", "data", "tools", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ARG", "C4", "RET", "PTH"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "ARG001", "ARG002"]
"alembic/env.py" = ["ANN001", "ANN201"]
"scripts/*" = ["ANN201", "ANN001"]
# 上下文提供者是协议 + 空实现，形参必须与协议签名一致（一期用不到这些入参）
"app/services/qa_context.py" = ["ARG002"]

[tool.uv]
# 硬链接会从用户级 uv 缓存链进 .venv，导致沙箱内读不到部分包文件；统一用复制模式
link-mode = "copy"

# PyPI 上的 Windows 版 torch 是 CPU 轮子（2.14.0+cpu），跑不了 GPU。
# RTX 4060 需要 CUDA 轮子，这里单独指到 PyTorch 官方索引。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# CUDA 轮子只有 Linux / Windows 有，macOS（Apple Silicon）要回落 PyPI 的默认轮子，
# 否则 uv sync 会报 "torch 2.14.0+cu130 没有当前平台可用的 wheel"。
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
